/* Pixel art. Dark wood bars top and bottom, a living savanna in the middle, one bright colour per card.
   Two pixel faces: Silkscreen for names, labels and buttons; Tiny5 for everything people say. */
:root{
  --ink:#1F1A2A; --ink2:#2B2438; --ink3:#3D3450; --och:#B9A6D9; --ochD:#9A88BE; --ochL:#D8CCEA; --cream:#F3EDE2; --dim:#8F84A8;
  --red:#C8443A; --gold:#F4A58A; --paper:#EFE8DC;
  --disp:"Silkscreen","Courier New",monospace; --body:"Fredoka",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:#120F1A; color:var(--cream); font-family:var(--body); font-weight:500; font-synthesis:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:14px;
  display:flex; flex-direction:column; justify-content:flex-start; min-height:100%}
b,strong,h2,h3,h4,th{font-weight:600}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0}
button:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
p{margin:0; text-wrap:pretty}
.shell{container-type:inline-size; container-name:shell; width:100%; max-width:1300px; margin:auto}
.stage{--u:1cqw; position:relative; aspect-ratio:16/9; overflow:hidden; background:#272035; font-size:calc(var(--u)*1.2); line-height:1.35; box-shadow:0 24px 70px rgba(0,0,0,.6); user-select:none; -webkit-user-select:none}
.bg{position:absolute; inset:0}
.bg svg{width:100%; height:100%; display:block}
.bg.fade{animation:bgin .5s steps(5)}
@keyframes bgin{from{filter:brightness(.4)}}
@keyframes fade{from{opacity:.2}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-500px)}to{transform:translateX(1900px)}}
.smoke rect{animation:smoke 4.5s steps(9) infinite; transform-box:fill-box; transform-origin:center}
.smoke rect:nth-child(2){animation-delay:-1.5s} .smoke rect:nth-child(3){animation-delay:-3s}
@keyframes smoke{0%{transform:translateY(10px); opacity:0}25%{opacity:1}100%{transform:translate(14px,-90px); opacity:0}}
.rain{animation:rain .45s linear infinite}
@keyframes rain{from{transform:translate(0,-60px)}to{transform:translate(-20px,0)}}
.tw{animation:tw 3s steps(2) infinite} @keyframes tw{50%{opacity:.1}}
.birds{animation:birds 40s linear infinite} @keyframes birds{from{transform:translate(-120px,220px)}to{transform:translate(1700px,140px)}}

/* chrome */
.chrome{position:absolute; left:calc(var(--u)*1.4); top:calc(var(--u)*2); display:flex; gap:calc(var(--u)*.7); z-index:40}
.disc{width:calc(var(--u)*3.2); height:calc(var(--u)*3.2); display:grid; place-items:center; border:2px solid var(--och); background:var(--ink)}
.disc svg{width:50%; height:50%}
.disc:hover{background:var(--och)} .disc:hover path{fill:var(--ink); stroke:var(--ink)}
.disc:active{transform:translateY(2px)}

/* the board */
.panel{position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; pointer-events:none}
.panel > *{pointer-events:auto}
.meters{width:100%; height:calc(var(--u)*7.2); background:#272035; border-bottom:calc(var(--u)*.3) solid var(--ink); display:flex; justify-content:center; align-items:center; gap:calc(var(--u)*5.5); flex:none}
.meter{position:relative; display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*.25)}
.meter svg{width:calc(var(--u)*3); height:calc(var(--u)*3); shape-rendering:crispEdges}
.meter .nm{font-family:var(--body); font-weight:700; font-size:calc(var(--u)*.72); letter-spacing:.08em; line-height:1; color:var(--dim)}
.meter .v{font-size:calc(var(--u)*1.15); color:var(--cream); line-height:1}
.meter .dot{position:absolute; top:calc(var(--u)*-.9); width:calc(var(--u)*.7); height:calc(var(--u)*.7); background:var(--cream); transform:scale(0); transition:transform .12s steps(2)}
.meter .dot.on{transform:scale(1)} .meter .dot.big{transform:scale(1.6)}
.speech{width:min(100%, calc(var(--u)*50)); height:calc(var(--u)*6.6); margin:calc(var(--u)*1) 0 calc(var(--u)*1.2); padding:0 calc(var(--u)*2); display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:calc(var(--u)*1.85); font-weight:700; line-height:1.25; color:var(--ink); text-wrap:balance; flex:none;
  background:var(--cream); border:calc(var(--u)*.3) solid var(--ink); box-shadow:0 calc(var(--u)*.45) 0 rgba(31,26,42,.45)}
.speech:empty{visibility:hidden}
.cardzone{position:relative; width:calc(var(--u)*19); height:calc(var(--u)*22.8); perspective:1200px; flex:none}
.card{position:absolute; inset:0; border-radius:calc(var(--u)*.7); overflow:hidden; touch-action:none; cursor:grab; will-change:transform; box-shadow:0 calc(var(--u)*.5) 0 rgba(31,26,42,.35)}
.card:active{cursor:grabbing}
.card .art{position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center}
.card .art .pt{width:100%; height:100%; shape-rendering:crispEdges}
.card .tilt{position:absolute; left:0; right:0; top:0; padding:calc(var(--u)*1.1) calc(var(--u)*1.2); background:var(--ink); text-align:center; opacity:0; transition:opacity .1s; z-index:2}
.card .tilt b{display:block; font-size:calc(var(--u)*1.8); line-height:1.1; color:var(--cream)}
.card.flip{animation:flipin .4s cubic-bezier(.2,.9,.3,1.1)}
@keyframes flipin{from{transform:rotateY(85deg) scale(.92); opacity:0}}
.card.fly{transition:transform .4s ease-in, opacity .4s ease-in}
.under{position:absolute; inset:0; border-radius:calc(var(--u)*.7); background:#5E527A; transform:translateY(calc(var(--u)*.45)) scale(.97)}
.under.u2{background:#4E4468; transform:translateY(calc(var(--u)*.9)) scale(.94)}
.chapcard{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:calc(var(--u)*1.6); text-align:center; gap:calc(var(--u)*.5); color:var(--cream)}
.chapcard .no{font-family:var(--disp); font-size:calc(var(--u)*7.5); line-height:.9; color:var(--gold)}
.chapcard .ti{font-family:var(--disp); font-size:calc(var(--u)*1.6); line-height:1.1; letter-spacing:.04em}
.chapcard .fa{margin-top:calc(var(--u)*1.2); border-top:2px solid var(--ink3); padding-top:calc(var(--u)*1); font-size:calc(var(--u)*1.15); line-height:1.3; color:var(--ochL)}
.chapcard .fa b{display:block; font-family:var(--body); font-weight:700; font-size:calc(var(--u)*2.1); color:var(--cream); line-height:1.1; margin-bottom:calc(var(--u)*.3)}
.pname{margin-top:calc(var(--u)*1.2); text-align:center; line-height:1.15; color:var(--ink); flex:none; background:var(--cream); border:calc(var(--u)*.25) solid var(--ink); padding:calc(var(--u)*.45) calc(var(--u)*1.4)}
.pname:empty{visibility:hidden}
.pname b{display:block; font-family:var(--disp); font-size:calc(var(--u)*1.55); letter-spacing:.06em}
.pname span{font-size:calc(var(--u)*1.15); opacity:.75}
.stage.dark .under{background:#2B2438} .stage.dark .under.u2{background:#231D30}
.stage.dark .card{box-shadow:0 0 0 2px #3D3450}
.botbar{margin-top:auto; width:100%; height:calc(var(--u)*6.6); background:#272035; border-top:calc(var(--u)*.3) solid var(--ink); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:calc(var(--u)*2); padding:0 calc(var(--u)*2.4); flex:none}
.bl b{display:block; font-family:var(--body); font-weight:700; font-size:calc(var(--u)*.8); letter-spacing:.1em; color:var(--dim); line-height:1.2}
.bl span{font-size:calc(var(--u)*1.9); line-height:1.1; color:var(--cream)}
.br{justify-self:end; text-align:right; font-size:calc(var(--u)*1.2); color:var(--ochL); line-height:1.35; max-width:calc(var(--u)*24)}
.rel{display:flex; gap:calc(var(--u)*.9)}
.av{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*.35)}
.av .c{width:calc(var(--u)*3.4); height:calc(var(--u)*3.4); border-radius:calc(var(--u)*.3); overflow:hidden; transition:transform .15s steps(2)}
.av .c svg{width:100%; height:100%}
.av .d{display:flex; gap:calc(var(--u)*.25)}
.av .d i{width:calc(var(--u)*.55); height:calc(var(--u)*.55); background:var(--ink3)} .av .d i.on{background:var(--gold)}
.av.t0 .c{filter:grayscale(1) brightness(.6)}
.av.up .c{outline:3px solid var(--gold); transform:translateY(-3px)} .av.down .c{outline:3px solid var(--red); transform:translateY(3px)}

/* the two answers */

<script>
/* ======================= Model and rules (shared by the game and the poster simulation) ======================= */
const STAGES = [
  {title:'The last two months', age:'not born yet', dur:0.25, base:0},
  {title:'Birth', age:'newborn', dur:0.1, base:24},
  {title:'The first year', age:'1–12 months', dur:0.9, base:12},
  {title:'Ages one to five', age:'1–5 years', dur:4, base:12},
];
const ARRIVE = {A:0, B:1, C:2};
const ARM_TEXT = {A:'during pregnancy', B:'at birth', C:'at six months', X:'never'};
const TH = 600, COWV = 450, CARE = 70, HOSP = 50, CLINIC = 15, NETC = 5;
const HR = [1, 1.52, 2.63, 9.40];
const NUTR = ['Well fed','Mildly underweight','Underweight','Severely underweight'];
const P_SICK = 0.5, P_DROUGHT = 0.3;
const ILL_AVG = (1-P_SICK)*0.6 + P_SICK*(0.5*1.2 + 0.5*3.0);
const PEOPLE = {
  dani:     {role:'Mother-in-law',    name:'Dani'},
  chv:      {role:'Health volunteer', name:'Atieno'},
  otieno:   {role:'Brother-in-law',   name:'Otieno'},
  achieng:  {role:'Neighbour',        name:'Achieng'},
  adhiambo: {role:'Church friend',    name:'Adhiambo'},
};
const PIDS = Object.keys(PEOPLE);

function newState(o){
  return {r:0, cash:30, assets:o.assets, sex:o.sex, arm:o.arm,
    tie:{dani:2, chv:1, otieno:2, achieng:1, adhiambo:1},
    knows:false, care:false, hosp:false, net:false, cow:false, nutr:1,
    received:false, refused:false, lentO:false,
    alive:true, surv:1, hz:[], helped:0, helpLog:[], sick:false, drought:false,
    health:0, invest:0, lent:0, deathStage:null, receivedAtDeath:false, picks:{}, food:{}, clinic:{}, flows:[], parts:{}};
}
const sexM = T => T.sex==='boy' ? 1.1 : 0.9;
const tie = (T,id,d) => { T.tie[id] = Math.max(0, Math.min(3, T.tie[id]+d)); };
function hzBirth(T, o={}){ return 24/1000 * ((o.hosp ?? T.hosp) ? .65 : 1) * ((o.care ?? T.care) ? .72 : 1) * sexM(T); }
function hzKid(T, r, n, net, ill){ return STAGES[r].base/1000 * HR[n]/HR[1] * (net ? .83 : 1) * ill * sexM(T); }
function nextN(T, food, fed){
  let n = T.nutr;
  if (food==='full') n = Math.max(0, n-1);
  else if (food==='skimp') n = Math.min(3, n+1);
  else if (T.drought && !fed) n = Math.min(3, n+1);
  else if (n>1) n--;
  return n;
}
function helperFor(T, exclude=[]){
  let best = null;
  for (const id of ['achieng','otieno','dani','adhiambo']){
    if (exclude.includes(id)) continue;
    if (T.tie[id]>=2 && (!best || T.tie[id] > T.tie[best])) best = id;
  }
  return best;
}
function book(T, kind, c){ if (kind==='health') T.health += c; else if (kind==='invest') T.invest += c; else if (kind==='lend') T.lent += c; }
/* Pay: from your own cash if you can; otherwise someone close to you lends it, and that favour is used up */
function pay(T, cost, exclude, kind){
  if (cost <= T.cash){ T.cash -= cost; book(T, kind, cost); return null; }
  const h = helperFor(T, exclude);
  if (!h) return false;
  tie(T, h, -1); T.helped++; T.helpLog.push(h); book(T, kind, cost);
  T.flows.push({from:h, to:'you', kind:'money', amt:cost, r:T.r});
  return h;
}

/* ---------- Who knocks ---------- */
const V = {
  chv_intro: {who:'chv',
    say: T => "I'm Atieno, the health volunteer. Five minutes?",
    opts: T => [
      {k:'yes', label:'Come in.', sub:'She tells you the odds from now on.', apply:T=>{ T.knows = true; tie(T,'chv',+1); }},
      {k:'no',  label:'Not today.', sub:"You won't know the odds.", apply:T=>{}}]},
  dani_work: {who:'dani',
    say: T => 'I dug fields till the day I gave birth. Back to work.',
    opts: T => [
      {k:'listen', label:'Yes, Dani.', sub:'Keep earning.', risk:T=>hzBirth(T,{care:false, hosp:false}), riskLabel:'birth risk', apply:T=>{}},
      {k:'rest', label:"I'll rest.", sub:"Eggs and beans. Dani's upset.", cost:CARE, kind:'health', help:true, exclude:['dani'],
        risk:T=>hzBirth(T,{care:true, hosp:false}), riskLabel:'birth risk', apply:T=>{ T.care = true; tie(T,'dani',-1); }}]},
  rumor: {who:'adhiambo',
    say: T => "That foreign money is cult money. Don't take it.",
    opts: T => [
      {k:'believe', label:"I won't sign.", sub:'Refuse the $1,000.', apply:T=>{ T.refused = true; tie(T,'adhiambo',+1); }},
      {k:'doubt', label:"That's just talk.", sub:'Sign up.', apply:T=>{}}]},
  sms: {who:null, special:true, opts: T => [{k:'ok', apply:T=>{ if (!T.refused){ T.cash += 1000; T.received = true; } }}]},
  otieno_lend: {who:'otieno', skip: T => !T.received,
    say: T => "Sis! I hear you're rich. Lend me $150 for school fees?",
    opts: T => [
      {k:'lend', label:'Here.', sub:'He owes you.', cost:150, kind:'lend', apply:T=>{ T.lentO = true; tie(T,'otieno',+1); }},
      {k:'no', label:'No.', sub:"He'll remember.", apply:T=>{ tie(T,'otieno',-1); }}]},
  otieno_again: {who:'otieno',
    say: T => "Sis, the pot's empty again. $100?",
    opts: T => [
      {k:'lend', label:'Last time.', sub:'Family is family.', cost:100, kind:'lend', apply:T=>{ tie(T,'otieno',+1); }},
      {k:'no', label:"I can't.", sub:"He'll sulk.", apply:T=>{ tie(T,'otieno',-1); }}]},
  achieng_ask: {who:'achieng',
    say: T => 'My baby has a fever. Lend me $10 for medicine?',
    opts: T => [
      {k:'lend', label:'Take it.', sub:"She'll return the favour.", cost:10, kind:'lend', apply:T=>{ tie(T,'achieng',+1); }},
      {k:'no', label:'I need it too.', sub:"She'll remember.", apply:T=>{ tie(T,'achieng',-1); }}]},
  achieng_cow: {who:'achieng', skip: T => !T.received || T.cow,
    say: T => "My cow gives milk every day. Want one? I'll help you buy." + (T.tie.achieng>=2 ? " I can get you $50 off." : ''),
    opts: T => { const p = T.tie.achieng>=2 ? 400 : 450, a = T.assets + COWV;
      return [
      {k:'buy', label:'Buy a cow.', sub:'Assets → $'+a+(a>=TH?', past $600.':'.'), cost:p, kind:'invest', apply:T=>{ T.cow = true; T.assets += COWV; tie(T,'achieng',+1); }},
      {k:'no', label:'Not now.', sub:'Keep the cash.', apply:T=>{}}]; }},
  dani_birth: {who:'dani',
    say: T => 'Have the baby here. The hospital is far and costs money.',
    opts: T => [
      {k:'home', label:'At home.', sub:'A birth attendant comes.', risk:T=>hzBirth(T,{hosp:false}), riskLabel:'birth risk', apply:T=>{}},
      {k:'hosp', label:'Hospital.', sub:"Motorbike ride. Dani's upset.", cost:HOSP, kind:'health', help:true, exclude:['dani'],
        risk:T=>hzBirth(T,{hosp:true}), riskLabel:'birth risk', apply:T=>{ T.hosp = true; tie(T,'dani',-1); }}]},
  chv_net: {who:'chv', skip: T => T.net,
    say: T => 'Free mosquito nets at the clinic today. Long queue.',
    opts: T => [
      {k:'yes', label:"I'll go.", sub:"Lose half a day's pay.", cost:NETC, kind:'health', help:true,
        risk:T=>hzKid(T,2,T.nutr,true,ILL_AVG), riskLabel:'risk this year', apply:T=>{ T.net = true; tie(T,'chv',+1); }},
      {k:'no', label:"Can't today.", sub:'No net.', risk:T=>hzKid(T,2,T.nutr,false,ILL_AVG), riskLabel:'risk this year', apply:T=>{}}]},
};

function startStage(T, rng){
  T.sick = T.r>=2 && rng() < P_SICK;
  T.drought = T.r>=2 && rng() < P_DROUGHT;
}
function stageQueue(T){
  const r = T.r, ms = ARRIVE[T.arm];
  const base = ({0:['chv_intro','dani_work'], 1:['achieng_ask','dani_birth'], 2:['chv_net'], 3:[]})[r].slice();
  const money = r===ms ? ['rumor','sms','otieno_lend'] : [];
  const extra = [];
  if (ms!==undefined && r===Math.min(3, ms+1) && r>ms) extra.push('achieng_cow');
  if (ms!==undefined && r===Math.min(3, ms+2) && r>ms) extra.push('otieno_again');
  const q = [];
  if (base.length) q.push(base.shift());
  q.push(...money, ...base, ...extra);
  return q;
}
function visitorLive(T, vid){
  if (vid==='otieno_again' && !T.lentO) return false;
  const v = V[vid]; return !(v.skip && v.skip(T));
}
function optState(T, o){
  const c = o.cost || 0;
  if (c <= T.cash) return {ok:true};
  if (o.help){ const h = helperFor(T, o.exclude||[]); return h ? {ok:true, helper:h} : {ok:false}; }
  return {ok:false};
}
function chooseOpt(T, vid, k){
  const o = V[vid].opts(T).find(x=>x.k===k);
  let helper = null;
  if (o.cost){
    if (o.help){ helper = pay(T, o.cost, o.exclude||[], o.kind); if (helper===false) return false; }
    else { if (o.cost > T.cash) return false; T.cash -= o.cost; book(T, o.kind, o.cost); }
  }
  o.apply(T); T.picks[vid] = k;
  const w = V[vid].who;
  if (o.kind==='lend') T.flows.push({from:'you', to:w, kind:'money', amt:o.cost, r:T.r});
  const INFO = {chv_intro:['risk facts', k==='yes'], dani_work:['advice', k==='listen'], dani_birth:['advice', k==='home'], rumor:['rumour', k==='believe'], achieng_cow:['cow tip', k==='buy'], chv_net:['net campaign', k==='yes']};
  if (INFO[vid]) T.flows.push({from:w, to:'you', kind:'info', label:INFO[vid][0], followed:INFO[vid][1], r:T.r});
  return {helper};
}

/* ---------- 每关结束：吃饭、看病、命运 ---------- */
function foodCosts(T){ const r = T.r, k = T.drought ? 1.5 : 1; return {full:Math.round(STAGES[r].dur*80*k), save:Math.round(STAGES[r].dur*40)}; }
function applyLedger(T, food, clinic){
  const r = T.r, out = {h:0, fedBy:null, clinicBy:null, clinicPaid:false, food};
  if (r===1){ out.h = hzBirth(T); T.parts[1] = {base:24, f:[['hospital', T.hosp?.65:1], ['rest', T.care?.72:1], [T.sex, sexM(T)]], h:out.h}; return out; }
  if (r<2) return out;
  const fc = foodCosts(T);
  if (food==='full'){ if (T.cash >= fc.full){ T.cash -= fc.full; T.health += fc.full; } else { food = 'normal'; out.food = 'normal'; } }
  if (food==='skimp') T.cash += fc.save;
  let fed = false;
  if (T.drought && food!=='full'){ const hp = helperFor(T); if (hp){ tie(T,hp,-1); T.helped++; T.helpLog.push(hp); fed = true; out.fedBy = hp; T.flows.push({from:hp, to:'you', kind:'food', r:T.r}); } }
  const n = nextN(T, food, fed);
  let ill = .6;
  if (T.sick){
    if (clinic){ const res = pay(T, CLINIC, [], 'health'); if (res!==false){ out.clinicPaid = true; out.clinicBy = res; } }

// Draw each card's art once into a high-resolution bitmap, then show it as an image:
// tilted cards then get smooth edges instead of jagged pixel seams.
function smoothDeck(root){
  root.querySelectorAll('.ccard .ca svg').forEach(s => {
    const W = 480, H = 576;
    let src = s.outerHTML;
    if (!/xmlns=/.test(src)) src = src.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    src = src.replace('<svg', `<svg width="${W}" height="${H}"`);
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.drawImage(img, 0, 0, W, H);
        const out = document.createElement('img'); out.alt = ''; out.src = c.toDataURL('image/png'); out.className = 'smooth';
        if (s.parentNode) s.replaceWith(out);
      } catch(e){}
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
  });
}

/* ======================= Cards ======================= */

      opts:[{side:'r', k:'full', label:'Eat well.', sub:'Eggs, milk, greens.'}, {side:'l', k:'normal', label:'Get by.', sub: S.drought ? 'The child gets thin.' : 'Whatever there is.'}]};

function preview(item, opt){
  const T = clone(S); let ok = true, helper = null, risk = null, riskLabel = '', cost = 0, fedBy = null;
  if (item.kind==='visitor'){
    const st = optState(S, opt.o); ok = st.ok; helper = st.helper || null; cost = opt.o.cost || 0;
    if (ok) chooseOpt(T, item.vid, opt.k);
    if (opt.o.risk){ risk = opt.o.risk(S); riskLabel = opt.o.riskLabel; }
  } else if (item.kind==='clinic'){
    if (opt.k==='yes'){ cost = CLINIC; ok = S.cash >= CLINIC || !!helperFor(S); if (S.cash < CLINIC) helper = helperFor(S); }
    risk = applyLedger(T, 'normal', opt.k==='yes' && ok).h; riskLabel = 'risk this season';
  } else if (item.kind==='food'){
    const fc = foodCosts(S); if (opt.k==='full'){ cost = fc.full; ok = S.cash >= fc.full; }
    const out = applyLedger(T, opt.k, L.clinic); risk = out.h; riskLabel = 'risk this season'; fedBy = out.fedBy;
  } else if (item.kind==='sms' && !S.refused){ T.cash += 1000; }
  const dTie = {}; PIDS.forEach(p => { if (T.tie[p]!==S.tie[p]) dTie[p] = T.tie[p]-S.tie[p]; });
  return {ok, helper, risk, riskLabel, cost, fedBy, dCash:T.cash-S.cash, dAssets:T.assets-S.assets, dTie};

function tagsFor(item, P){

  if (P.ok && P.helper && item.kind!=='food') t.push(`<span class="tg help">${NAME(P.helper)} lends it</span>`);
  if (P.fedBy) t.push(`<span class="tg help">${NAME(P.fedBy)} brings maize</span>`);

  Object.entries(P.dTie).forEach(([p,d]) => { if (p!==P.helper) t.push(`<span class="tg">${NAME(p)} ${d>0?'+':'−'}${Math.abs(d)}</span>`); });

}
function dotsFor(P){

function showCard(){
  while (qi < Q.length && Q[qi].kind==='visitor' && !visitorLive(S, Q[qi].vid)) qi++;

  const item = Q[qi];

  const idxOf = s => { const i = c.opts.findIndex(o => o.side===s); return i<0 && c.solo ? 0 : i; };
  const hot = s => {
    $('signs').querySelectorAll('.sign').forEach(b => b.classList.toggle('hot', !!(s && (b.dataset.s===s || (c.solo && b.dataset.s==='r')))));
    const tl = $('tilt'); if (!tl) return;

  $('signs').querySelectorAll('.sign[data-s]').forEach(b => {
    const s = b.dataset.s;
    b.onmouseenter = () => hot(s); b.onmouseleave = () => hot(null); b.onfocus = () => hot(s); b.onblur = () => hot(null);
    b.onclick = () => commit(s);

    const s = dx < -22 ? 'l' : dx > 22 ? 'r' : null; const i = s ? idxOf(s) : -1; hot(s && i>=0 && P[i].ok ? s : null); };
  card.onpointerup = card.onpointercancel = () => { if (x0===null) return; x0 = null;
    const s = dx < 0 ? 'l' : 'r', i = idxOf(s), w = card.offsetWidth;

    else { card.style.transition = 'transform .25s'; card.style.transform = ''; hot(null); } };

}

function applyChoice(item, opt){

/* ======================= Flow ======================= */
function newGame(key){
  gid++; clearTimeout(timer); clearOv(); busy = false;
  demo = key ? DEMOS[key] : null;
  S = newState({assets: demo ? demo.assets : 60 + Math.floor(Math.random()*17)*10,
                sex: demo ? demo.sex : (Math.random()<.5 ? 'boy' : 'girl'),
                arm: demo ? demo.arm : ['A','B','C'][Math.floor(Math.random()*3)]});
  $('chrome').hidden = false; $('panel').hidden = false;
  beginStage();
}
function beginStage(){
  if (demo){ const e = demo.events[S.r] || {}; S.sick = !!e.sick; S.drought = !!e.drought; } else startStage(S, Math.random);
  L = {food:'normal', clinic:false};
  Q = [{kind:'chapter'}, ...stageQueue(S).map(v => v==='sms' ? {kind:'sms'} : {kind:'visitor', vid:v})];
  if (S.r>=2){ if (S.sick) Q.push({kind:'clinic'}); Q.push({kind:'food'}); }
  qi = 0;
  setBg(stageBg());

}
function endCards(){
  keyFn = null; $('signs').innerHTML = ''; $('cardzone').innerHTML = '';

  showFate();
}
function nextStage(){
  if (!S.alive) return showDeath();
  if (S.r >= STAGES.length) return showEnding();
  beginStage();
}

/* ---------- Fate ---------- */
function wedge(deg){ const a=(deg-90)*Math.PI/180, x=100+100*Math.cos(a), y=100+100*Math.sin(a); return `M100 100 L100 0 A100 100 0 ${deg>180?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z`; }

function oddsTab(){
  const ctl = STAGES.map((st,i) => i===0 ? 0 : i===1 ? st.base/1000 : st.base/1000*ILL_AVG);
  const hs = [1,2,3].map(r => S.parts[r] ? S.parts[r].h : null);
  const max = Math.max(...hs.filter(x=>x!=null), ...ctl.slice(1)) * 1.1;
  const names = {1:['Birth','first month'], 2:['First year','1–12 months'], 3:['Ages 1–5','four years']};
  const rows = [1,2,3].map(r => {
    const P = S.parts[r];
    if (!P) return `<div class="step"><div class="nm">${names[r][0]}<small>not reached</small></div><div class="bar"></div><div class="val" style="color:var(--muted)">—</div></div>`;
    const mult = P.f.map(([n,v]) => `<span class="${v<.995?'lo':v>1.005?'hi':''}">${n} ×${v.toFixed(2)}</span>`).join('');
    return `<div class="step"><div class="nm">${names[r][0]}<small>base ${P.base} in 1,000</small></div>
      <div class="bar"><i style="width:${P.h/max*100}%"></i><i class="ctl" style="width:${ctl[r]/max*100}%"></i></div><div class="val">${pct(P.h)}</div>
      <div class="mult">${mult}</div></div>`;
  }).join('');
  const done = [1,2,3].filter(r => S.parts[r]);
  const surv = done.reduce((p,r) => p*(1-S.parts[r].h), 1);
  const eq = S.alive
    ? `<span class="eqk">Chance of reaching five</span><span class="eqv">${done.map(r=>`(1 − ${pct(S.parts[r].h)})`).join(' × ')} = <b>${(surv*100).toFixed(1)}%</b></span>`
    : `<span class="eqk">The wheel landed in the red in chapter ${S.deathStage+1}.</span><span class="eqv">Odds of getting that far: <b>${(S.surv/(1-S.hz[S.hz.length-1])*100).toFixed(1)}%</b></span>`;
  return `<div class="mgrid"><div><div class="chain">${rows}</div><div class="eq">${eq}</div>
      <div class="lgd"><span><i style="background:#C8443A"></i>your risk</span><span><i style="background:#F3EDE2;width:3px;height:12px"></i>a family without the $1,000</span><span><i style="background:#2E4A2C;height:10px;width:14px"></i>lowers risk</span><span><i style="background:#5A2219;height:10px;width:14px"></i>raises risk</span></div></div>
    <div class="side-note"><p><b>Each season's risk = base rate × your multipliers.</b></p><p style="margin-top:calc(var(--u)*.8)">Base rates are tuned so a family without the $1,000 matches Kenya: about 40 infant deaths per 1,000 ${cite('walker','igme')}.</p>
      <p style="margin-top:calc(var(--u)*.8)">Multipliers come from studies: bed net ×0.83 ${cite('coch')}, underweight ×1.5 to ×9.4 ${cite('olo')}. Hospital ×0.65 and rest ×0.72 are our assumptions, set so that spending on the child reproduces the 48% drop ${cite('walker')}.</p></div></div>`;
}
function villageTab(){
  const net = {}, lent = {}, got = {}, info = {}, food = {};
  PIDS.forEach(p => { net[p] = 0; lent[p] = 0; got[p] = 0; info[p] = []; food[p] = 0; });
  S.flows.forEach(f => {
    const p = f.from==='you' ? f.to : f.from; if (!(p in net)) return;
    if (f.kind==='money'){ if (f.from==='you') lent[p] += f.amt; else got[p] += f.amt; }
    if (f.kind==='info') info[p].push(f);
    if (f.kind==='food') food[p]++;
  });
  const he = p => p==='otieno' ? 'He' : 'She', him = p => p==='otieno' ? 'him' : 'her';
  const SAY = {
    'risk facts': ok => ok ? 'Told you the real risks. You listened, so you could see the odds.' : 'Offered to tell you the risks. You turned her away.',
    'advice':     (ok, f) => f.r===0 ? (ok ? 'Told you to keep working. You did.' : 'Told you to keep working. You rested instead.')
                                     : (ok ? 'Wanted the birth at home. You agreed.' : 'Wanted the birth at home. You went to hospital.'),
    'rumour':     ok => ok ? 'Said the money was cult money. You believed her and refused it.' : 'Passed on the cult rumour. You ignored it.',
    'cow tip':    ok => ok ? 'Offered her cow. You bought it.' : 'Offered her cow. You said no.',
    'net campaign': ok => ok ? 'Brought a free bed net. You took it.' : 'Offered a bed net. You said no.',
  };
  let totLent = 0, totGot = 0, heard = 0, acted = 0, lenders = 0, helpers = 0;
  const rows = PIDS.map(p => {
    const lines = [];
    if (lent[p]){ lines.push(`You lent ${him(p)} ${money(lent[p])}.`); totLent += lent[p]; lenders++; }
    if (got[p]){ lines.push(`${he(p)} covered ${money(got[p])} for you when you were short.`); totGot += got[p]; helpers++; }
    if (food[p]){ lines.push(`${he(p)} brought maize in a dry year.`); helpers += got[p] ? 0 : 1; }
    info[p].forEach(f => { heard++; if (f.followed) acted++; lines.push(SAY[f.label] ? SAY[f.label](f.followed, f) : f.label); });
    const n = got[p] - lent[p];
    const m = n > 0 ? `<span class="pos">+${money(n)}</span>` : n < 0 ? `<span class="neg">−${money(-n)}</span>` : '<span class="zero">—</span>';
    return `<tr><td><div class="who2"><div class="xface">${miniFace(p)}</div><div><b>${NAME(p)}</b><span>${PEOPLE[p].role}</span></div></div></td>
      <td class="tie">${[0,1,2].map(i=>`<i class="${i<S.tie[p]?'on':''}"></i>`).join('')}</td><td class="n">${m}</td>
      <td>${lines.length ? lines.join(' ') : '<span class="zero">Nothing passed between you.</span>'}</td></tr>`;
  }).join('');
  const summary = `You lent <b>${money(totLent)}</b> to ${lenders} ${lenders===1?'person':'people'}, and people covered <b>${money(totGot)}</b> for you. You heard <b>${heard}</b> pieces of advice or news and acted on <b>${acted}</b>.`;
  return `<p class="side-note" style="margin-bottom:calc(var(--u)*1)">${summary}</p>
    <div class="tbl"><table class="vt"><tr><th>Person</th><th>Closeness</th><th>Money, net</th><th>What happened</th></tr>${rows}</table></div>
    <div class="side-note rules" style="margin-top:calc(var(--u)*1.2)"><b>How closeness works</b>
      <ul><li>Everyone starts with 1 or 2 dots and can have 0 to 3.</li>
        <li>Lending them money, or taking their advice: +1 dot. Refusing them: −1 dot.</li>
        <li>When you can't afford something (rest, hospital, clinic, food in a dry year), the closest person with 2 or more dots pays for you, and loses a dot.</li>
        <li>A grey face has 0 dots: that person won't help you.</li>
        <li>So lending makes you poorer now, but buys you help later.</li></ul>
      <p>Kin and neighbours act as insurance ${cite('js')}, but they also ask for money ${cite('jo')}, and news reaches you only through the people you know ${cite('bcdj')}.</p></div>`;
}
function stageDeaths(hz){
  let alive = 1000; return [1,2,3].map(r => { const d = alive*hz[r]; alive -= d; return d; });

function unitChart(parts){
  const cols = 40, sz = 10; let i = 0, s = '';
  const colors = ['#7A1E14','#C8443A','#E0884A'];
  const counts = parts.map(Math.round);
  for (let k=0;k<3;k++) for (let n=0;n<counts[k];n++,i++){ const x = (i%cols)*sz, y = Math.floor(i/cols)*sz; s += `<rect x="${x+1}" y="${y+1}" width="${sz-2}" height="${sz-2}" fill="${colors[k]}"/>`; }
  for (;i<1000;i++){ const x = (i%cols)*sz, y = Math.floor(i/cols)*sz; s += `<rect x="${x+1}" y="${y+1}" width="${sz-2}" height="${sz-2}" fill="#3D3450"/>`; }
  return svg(s, '0 0 400 250', 'class="dotgrid"');
}

    <div>
      <h4 class="mh">When the money arrives</h4>
      <p class="side-note">One way of playing (everything on the child); only the arrival time changes. Babies who die before age one, per 1,000 families.</p>
      <div class="tchart">${tbars}</div>
      <h4 class="mh" style="margin-top:calc(var(--u)*3.4)">What the numbers say</h4>
      <ul class="takes">
        <li><b>The money saves children.</b> Compare “${get('kid') && D.rows[keys.indexOf('kid')][0]}” with “${D.rows[0][0]}”: <b>${get('none').u5}</b> → <b>${get('kid').u5}</b> deaths per 1,000 families, so ${get('none').u5 - get('kid').u5} more children reach five. But its purple bar is ${get('kid').win}%: the money is spent and no family ends above $600.</li>
        <li><b>A cow fights poverty, not death.</b> “${D.rows[keys.indexOf('cow')][0]}”: <b>${get('cow').win}%</b> of families end above $600, but <b>${get('cow').u5}</b> children die per 1,000, only ${get('none').u5 - get('cow').u5} fewer than with no money.</li>
        <li><b>Order lets you have both.</b> “${D.rows[keys.indexOf('mix')][0]}”: <b>${get('mix').u5}</b> deaths per 1,000 (${get('none').u5 - get('mix').u5} fewer than no money) and <b>${get('mix').win}%</b> above $600.</li>
        <li><b>Earlier money saves more babies.</b> In the chart above: <b>${imr[0]}</b> if it comes in pregnancy, <b>${imr[1]}</b> at birth, <b>${imr[2]}</b> at six months, <b>${never}</b> without it, as in the real study ${cite('walker')}.</li>
      </ul>
      <h4 class="mh" style="margin-top:calc(var(--u)*2.4)">Six strategies, seven endings</h4>
      <p class="side-note">A strategy is how you play. The ending is what happened, and the wheel decides between several: the same strategy can end differently. The percentages under each row show how often each ending comes up. <b>Too Late</b> only happens when the money comes at six months, which these runs leave out.</p>
    </div></div>`;
}
function choicesTab(){
  const rows = [
    ['Let Atieno in', 'You see the baby’s risk on every choice after this. Nothing else changes.', 'free', `Information arrives through people ${cite('bcdj')}`],
    ['Rest before the birth', 'Birth risk ×0.72. Dani is upset (−1).', '$70', 'Our assumption'],
    ['Give birth in hospital', 'Birth risk ×0.65. Dani is upset (−1).', '$50', 'Our assumption'],
    ['Get the free bed net', 'Risk ×0.83 in every later chapter.', '$5 (half a day’s pay)', cite('coch')],
    ['Feed the child well', 'Moves the child one step towards well fed. Underweight raises risk ×1.52, ×2.63 or ×9.40 by severity.', '$72 to $480, more in a dry year', cite('olo')],
    ['Take a fever to the clinic', 'Fever multiplies risk ×1.2 instead of ×3.0.', '$15', 'Our assumption'],
    ['Believe the rumour', 'The $1,000 never arrives.', '—', cite('gd')],
    ['Lend to kin or a neighbour', 'Closeness +1. When you are short, the closest person with 2+ dots pays and loses a dot.', '$10 to $150', cite('jo','js')],
    ['Buy the cow', 'Assets +$450. Past $600, income rises from $60 to $280 a year.', '$400 to $450', cite('bal')],
    ['When the money comes', 'Random: during pregnancy, at birth or at six months.', '—', cite('walker')],
    ['Starting risk', 'Birth 24 per 1,000; each later chapter 12 per 1,000 before multipliers. Boys ×1.1, girls ×0.9.', '—', cite('igme')],
    ['Bad luck', 'Each later chapter: 50% chance of a fever, 30% chance of a dry year.', '—', 'Our assumption'],
  ];
  return `<h4 class="mh">Every choice, and what it does for every player</h4>
    <div class="tbl"><table class="src"><tr><th>Choice</th><th>What it changes in the model</th><th>Cost</th><th>Source</th></tr>
    ${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="n2">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
    <p class="side-note" style="margin-top:calc(var(--u)*1)">Chance of reaching five = (1 − birth risk) × (1 − first-year risk) × (1 − risk from 1 to 5). Each chapter's risk = starting risk × the multipliers above.</p>`;
}
function showModel(){
  const mine = !!(S && S.hz && S.hz.length);
  const hz = mine ? STAGES.map((st,i) => i < S.hz.length ? S.hz[i] : (i===1 ? st.base/1000 : st.base/1000*ILL_AVG)) : null;
  const you = mine ? Math.round((1 - hz.reduce((p,h)=>p*(1-h),1))*1000) : null;
  const o = ov('', `<div class="box model"><div class="row" style="justify-content:space-between;margin:0;align-items:flex-start">
      <div><h3>The model behind the game</h3><p class="sub">${mine ? "Your own game first, then what happens to everyone who plays." : "What happens to everyone who plays, and where every number comes from."}</p></div><button class="wbtn" id="cm">Back</button></div>
    <div class="tabs" role="tablist">${mine ? `<span class="tgrp">Your game</span><button class="tab" role="tab" data-t="odds">Your odds</button><button class="tab" role="tab" data-t="village">Your village</button><button class="tab" role="tab" data-t="fam">1,000 like you</button>` : ''}
      <span class="tgrp">Everyone</span><button class="tab" role="tab" data-t="strat">Six strategies</button><button class="tab" role="tab" data-t="choices">Every choice</button>
      <span class="tgrp"></span><button class="tab" role="tab" data-t="src">Sources</button><button class="tab" role="tab" data-t="data">Poster data</button></div>
    <div id="tabbody"></div></div>`);
  const show = t => { o.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t===t));
    if (t==='strat'){ $('tabbody').innerHTML = '<p class="side-note">Simulating 180,000 families…</p>'; setTimeout(() => { if ($('tabbody')) $('tabbody').innerHTML = strategiesTab(you); }, 30); return; }
    $('tabbody').innerHTML = t==='odds' ? oddsTab() : t==='village' ? villageTab() : t==='fam' ? familiesTab() : t==='choices' ? choicesTab() : sourcesTab(); };
  o.querySelectorAll('.tab').forEach(b => b.onclick = () => b.dataset.t==='data' ? showData() : show(b.dataset.t));
  $('cm').onclick = () => o.remove();
  show(mine ? 'odds' : 'strat');
}

  const o = ov('', `<div class="box intro">
    <div class="who"><div class="mom" style="background:${CARD_BG.mom}">${momPortrait()}</div>
      <div><span class="k">YOU ARE</span><h2>Akinyi</h2><p>Seven months pregnant in Siaya County, Kenya. A charity will send you <b>$1,000</b> by phone, no strings attached. Economists call this a <b>cash transfer</b>. You don't know when it will arrive.</p>
      <p class="goal">Goal: keep your child alive until age 5.</p></div></div>
    <div class="legend">
      ${leg('cash','Cash','Money in hand')}
      ${leg('kid','Child','Chance your child is alive')}
      ${leg('cow','Assets','What you own. Past the line ($600), you keep growing', .6)}
      ${leg('ties','Goodwill','Your closeness with everyone, added up')}
      <div class="lg"><div class="ic sg"><span>◀</span><span>▶</span></div><div><b>Choose</b><span>Swipe the card or tap an answer</span></div></div>
      <div class="lg"><div class="ic wh">${svg('<circle cx="20" cy="20" r="18" fill="#F3EDE2"/><path d="M20 20 L20 2 A18 18 0 0 1 31 6Z" fill="#C8443A"/>','0 0 40 40')}</div><div><b>Wheel</b><span>Ends each chapter. Red is the real risk</span></div></div>
      <div class="lg wide"><div class="ic faces">${miniFace('achieng')}</div><div><b>Relationships</b><span>More dots, closer. Can't pay for something? Someone with 2+ dots pays for you, and loses a dot. A grey face has 0 dots and won't help. Hover a face to see who it is.</span></div></div>
    </div>
    <div class="row" style="grid-column:1/-1;justify-content:flex-end;margin-top:0"><button class="wbtn big" id="go">Start</button></div></div>`);

}

function floatText(t, color, leftPct){
  const el = document.createElement('div'); el.className = 'float'; el.textContent = t; el.style.background = color; el.style.left = leftPct + '%';
  fx.appendChild(el); setTimeout(() => el.remove(), 1700);
}

$('homeBtn').onclick = showTitle;
$('reBtn').onclick = () => newGame(demo ? Object.keys(DEMOS).find(k => DEMOS[k]===demo) : undefined);
